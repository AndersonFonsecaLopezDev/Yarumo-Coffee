name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub Actions."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Falta el secreto SUPABASE_PROJECT_ID en GitHub Actions."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Falta el secreto SUPABASE_DB_PASSWORD en GitHub Actions."; exit 1; }
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations
        run: supabase db push
