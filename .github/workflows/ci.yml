name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || vars.E2E_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check E2E_BASE_URL configuration
        id: check_e2e_url
        shell: bash
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::notice title=E2E Tests Skipped::E2E_BASE_URL no está configurada como variable o secreto en el repositorio. Omitiendo pruebas contra datos reales para no fallar el check en PRs sin entorno de despliegue configurado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.check_e2e_url.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        if: steps.check_e2e_url.outputs.skip != 'true'
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || vars.E2E_BASE_URL }}

